<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Presentation Coach</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#172033;background:#e9edf5}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 18px;background:radial-gradient(circle at 15% 10%,#fff 0,#eef2f8 42%,#dfe5ef 100%);overflow:hidden}main{width:min(900px,100%);background:#ffffffd9;border:1px solid #fff;border-radius:28px;padding:36px;box-shadow:0 20px 55px #25324b22;backdrop-filter:blur(14px)}.eyebrow{margin:0 0 9px;color:#7355d9;font-size:14px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:0 0 10px;font-size:clamp(28px,4vw,40px)}.intro{color:#667085;margin:0 0 24px;font-size:17px}video{display:block;width:100%;max-height:470px;aspect-ratio:16/9;object-fit:cover;background:#111;border-radius:20px;margin:20px 0}button{border:0;border-radius:12px;padding:14px 19px;margin:4px;background:#7355d9;color:#fff;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#667085}.status{margin-top:18px;min-height:24px;color:#667085;font-size:15px}.recap-trigger{display:none;margin:16px 0 0}.recap-trigger.visible{display:inline-block}.recap-modal{display:none;position:fixed;inset:0;z-index:5;place-items:center;padding:20px;background:#17203366;backdrop-filter:blur(8px)}.recap-modal.is-open{display:grid}.recap-card{width:min(680px,100%);max-height:calc(100vh - 40px);overflow:auto;padding:30px;border:1px solid #fff;border-radius:24px;background:#fff;box-shadow:0 24px 70px #17203344}.result-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:19px}.result-title{margin:0;font-size:24px}.score{color:#7355d9;font-size:28px;font-weight:800;white-space:nowrap}.summary-list{display:grid;gap:11px}.summary-row{display:grid;grid-template-columns:140px 1fr auto;align-items:center;gap:14px;padding:16px;border-radius:14px;background:#f7f8fb;border:1px solid #e8eaf0;font-size:16px}.metric{font-weight:800;text-transform:capitalize}.metric-value{color:#4b5565}.confidence{color:#7355d9;font-size:14px;font-weight:800}.close{display:block;margin:20px 0 0 auto;background:#667085}@media(max-width:560px){body{padding:14px;overflow:auto}main{padding:22px}.summary-row{grid-template-columns:1fr auto;gap:5px}.metric-value{grid-column:1/-1}.confidence{grid-row:1;grid-column:2}}
  </style>
</head>
<body><main>
  <p class="eyebrow">AI Presentation Coach</p><h1>Latih presentasimu dengan percaya diri</h1><p class="intro">Rekam sesi latihan dan dapatkan rekap analisis gerakan serta postur tubuhmu.</p>
  <video id="preview" autoplay muted playsinline></video><div><button id="start">Mulai kamera</button><button id="record" disabled>Mulai rekam</button><button id="stop" class="secondary" disabled>Berhenti &amp; analisis</button></div>
  <div id="status" class="status">Belum ada sesi analisis.</div><button id="recapButton" class="recap-trigger">Lihat hasil rekap</button>
</main><div id="recapModal" class="recap-modal" aria-hidden="true"><section class="recap-card" role="dialog" aria-modal="true" aria-labelledby="recapTitle"><div id="result"><div class="result-head"><h2 id="recapTitle" class="result-title">Rekap analisis</h2><span id="score" class="score"></span></div><div id="summaryList" class="summary-list"></div></div><button id="closeRecap" class="close">Tutup rekap</button></section></div>
<script>
  const video=document.querySelector('#preview'),status=document.querySelector('#status'),recapButton=document.querySelector('#recapButton'),recapModal=document.querySelector('#recapModal'),closeRecap=document.querySelector('#closeRecap'),score=document.querySelector('#score'),summaryList=document.querySelector('#summaryList'),start=document.querySelector('#start'),record=document.querySelector('#record'),stop=document.querySelector('#stop');let stream,recorder,chunks=[];
  function showStatus(message){status.textContent=message}
  function renderAnalysis(data){if(!data.predictions){showStatus(data.message||JSON.stringify(data));return}score.textContent=`${data.score}/100`;summaryList.innerHTML=Object.entries(data.predictions).map(([name,item])=>`<div class="summary-row"><span class="metric">${name}</span><span class="metric-value">${item.label}</span><span class="confidence">${Math.round(item.confidence*100)}%</span></div>`).join('');showStatus('Analisis berhasil. Hasil rekap siap dilihat.');recapButton.classList.add('visible')}
  function openRecap(){recapModal.classList.add('is-open');recapModal.setAttribute('aria-hidden','false')}function closeRecapPanel(){recapModal.classList.remove('is-open');recapModal.setAttribute('aria-hidden','true')}
  recapButton.onclick=openRecap;closeRecap.onclick=closeRecapPanel;recapModal.onclick=e=>{if(e.target===recapModal)closeRecapPanel()};
  start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});video.srcObject=stream;record.disabled=false;start.disabled=true;showStatus('Kamera aktif. Siap merekam.')}catch(e){showStatus('Kamera tidak bisa dibuka: '+e.message)}};
  record.onclick=()=>{chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.start();record.disabled=true;stop.disabled=false;showStatus('Sedang merekam...')};
  stop.onclick=()=>{recorder.stop();record.disabled=false;stop.disabled=true;recorder.onstop=async()=>{showStatus('Mengirim sesi untuk dianalisis...');const form=new FormData();form.append('video',new Blob(chunks,{type:'video/webm'}),'session.webm');try{const r=await fetch('/api/analyze',{method:'POST',body:form});const text=await r.text();let data;try{data=JSON.parse(text)}catch(_){throw new Error('Endpoint mengembalikan HTTP '+r.status)}if(!r.ok)throw new Error(data.message||data.error||'HTTP '+r.status);renderAnalysis(data)}catch(e){showStatus('Gagal menganalisis video: '+e.message)}}};
</script></body></html>
